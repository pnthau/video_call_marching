# Cloud Run Service template. Documentation/template only; never apply without
# a separately authorized resource-creation gate.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: video-call-staging
  labels:
    managed-by: deployment-hardening
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      serviceAccountName: cr-staging-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - name: app
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/video-call@sha256:${IMAGE_DIGEST}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: cloudrun
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              value: ${PROJECT_ID}:${REGION}:video-call-staging-sql
            - name: MYSQL_DATABASE
              value: video_call_staging
            - name: MYSQL_USERNAME
              value: app_runtime
            - name: PUBLIC_BASE_URL
              value: ${PUBLIC_BASE_URL}
            - name: GOOGLE_CLIENT_ID
              value: ${GOOGLE_CLIENT_ID}
            - name: CLOUDINARY_CLOUD_NAME
              value: ${CLOUDINARY_CLOUD_NAME}
            - name: CLOUDINARY_API_KEY
              value: ${CLOUDINARY_API_KEY}
            - name: AGORA_APP_ID
              value: ${AGORA_APP_ID}
            - name: WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
              value: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cr-staging-runtime-db-password
                  key: "1"
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cr-staging-oauth-client-secret
                  key: "1"
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: cr-staging-cloudinary-secret
                  key: "1"
            - name: AGORA_APP_CERTIFICATE
              valueFrom:
                secretKeyRef:
                  name: cr-staging-agora-certificate
                  key: "1"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          # Traffic assignment remains a separate, authorized operation.
