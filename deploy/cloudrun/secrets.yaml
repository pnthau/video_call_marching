# Secret reference inventory only. Values and payloads must never be committed.
# Secret versions are pinned per revision/job for deterministic rollback.
secrets:
  - name: cr-staging-runtime-db-password
    consumer: cr-staging-runtime
    purpose: MYSQL_PASSWORD for app_runtime
    version: "1"
  - name: cr-staging-migrator-db-password
    consumer: cr-staging-migrator
    purpose: MIGRATION_MYSQL_PASSWORD for app_migrator
    version: "1"
  - name: cr-staging-oauth-client-secret
    consumer: cr-staging-runtime
    purpose: GOOGLE_CLIENT_SECRET
    version: "1"
  - name: cr-staging-agora-certificate
    consumer: cr-staging-runtime
    purpose: AGORA_APP_CERTIFICATE
    version: "1"
  - name: cr-staging-cloudinary-secret
    consumer: cr-staging-runtime
    purpose: CLOUDINARY_API_SECRET
    version: "1"
forbidden:
  - MYSQL_ROOT_PASSWORD
  - secret payloads in manifests, source, image, logs, command history, or reports
