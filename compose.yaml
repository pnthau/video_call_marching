services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_PORT: "${SERVER_PORT:?SERVER_PORT is required}"
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    restart: on-failure:5
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}"
      SERVER_PORT: "${SERVER_PORT:?SERVER_PORT is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      MYSQL_USERNAME: "${MYSQL_USERNAME:?MYSQL_USERNAME is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}"
      AGORA_APP_ID: "${AGORA_APP_ID:?AGORA_APP_ID is required}"
      AGORA_APP_CERTIFICATE: "${AGORA_APP_CERTIFICATE:?AGORA_APP_CERTIFICATE is required}"
      WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: "${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:?WEBSOCKET_ALLOWED_ORIGIN_PATTERNS is required}"
      APP_BASE_URL: "${APP_BASE_URL:?APP_BASE_URL is required}"
    expose:
      - "${SERVER_PORT:?SERVER_PORT is required}"
    networks:
      - proxy
      - db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  mysql:
    image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
    restart: on-failure:5
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      MYSQL_USER: "${MYSQL_USERNAME:?MYSQL_USERNAME is required}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:

networks:
  proxy:
    driver: bridge
  db:
    driver: bridge
