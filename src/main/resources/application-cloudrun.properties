# Cloud Run serving profile. Use only with Cloud SQL Java Connector settings.
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8080}}
spring.main.web-application-type=servlet
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

# The connector owns the encrypted public-IP connection. Do not replace this
# URL with SPRING_DATASOURCE_URL in the Cloud Run profile.
spring.datasource.url=jdbc:mysql:///${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.hikari.data-source-properties.cloudSqlInstance=${CLOUD_SQL_INSTANCE_CONNECTION_NAME}
spring.datasource.hikari.data-source-properties.ipTypes=PUBLIC
spring.datasource.hikari.data-source-properties.cloudSqlRefreshStrategy=lazy

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF

spring.security.oauth2.client.registration.google.redirect-uri=${PUBLIC_BASE_URL:${APP_BASE_URL}}/login/oauth2/code/google
app.base-url=${PUBLIC_BASE_URL:${APP_BASE_URL}}
