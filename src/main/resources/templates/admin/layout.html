<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Admin</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Admin</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/admin/users}">Người dùng</a>
            <a class="nav-link" th:href="@{/admin/rubrics}">Rubric</a>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <th:block th:replace="${content}"/>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
