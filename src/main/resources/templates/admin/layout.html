<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:replace="${title}">CAStudy Admin</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 10% 0%, #dbeafe 0, transparent 25%),
                #f5f8ff;
            color: #172033;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* ================= SIDEBAR ================= */

        .admin-sidebar {
            width: 250px;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            background: #111827;
            color: #cbd5e1;
            box-shadow: 10px 0 30px rgba(15, 23, 42, .08);
        }

        .admin-brand {
            height: 76px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-bottom: 1px solid #1f2937;
        }

        .admin-logo {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-weight: 900;
            font-size: 18px;
        }

        .admin-brand-text {
            display: flex;
            flex-direction: column;
        }

        .admin-brand-text strong {
            color: white;
            font-size: 15px;
        }

        .admin-brand-text span {
            margin-top: 2px;
            color: #64748b;
            font-size: 10px;
        }

        .admin-nav {
            flex: 1;
            padding: 15px 12px;
        }

        .admin-section {
            padding: 17px 12px 7px;
            color: #64748b;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            margin-bottom: 4px;
            border-radius: 11px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: .2s ease;
        }

        .admin-nav-link:hover {
            color: white;
            background: #1f2937;
        }

        .admin-nav-link.active {
            color: white;
            background: linear-gradient(
                    135deg,
                    rgba(37, 99, 235, .95),
                    rgba(79, 70, 229, .95)
            );
            box-shadow: 0 8px 18px rgba(37, 99, 235, .18);
        }

        .admin-nav-icon {
            width: 25px;
            text-align: center;
            font-size: 15px;
        }

        /* ================= SIDEBAR FOOTER ================= */

        .admin-sidebar-footer {
            padding: 16px;
            border-top: 1px solid #1f2937;
        }

        .admin-logout {
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-radius: 10px;
            background: #1f2937;
            color: #f87171;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            transition: .2s ease;
        }

        .admin-logout:hover {
            background: #3f1d25;
        }

        /* ================= TOPBAR ================= */

        .admin-topbar {
            height: 72px;
            margin-left: 250px;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, .92);
            border-bottom: 1px solid #e2e8f0;
            backdrop-filter: blur(14px);
        }

        .admin-page-title {
            color: #172033;
            font-size: 18px;
            font-weight: 800;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-user-avatar {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dbeafe;
            color: #2563eb;
            font-size: 13px;
            font-weight: 800;
        }

        .admin-user-info {
            display: flex;
            flex-direction: column;
        }

        .admin-user-info small {
            color: #94a3b8;
            font-size: 9px;
        }

        .admin-user-info strong {
            color: #334155;
            font-size: 12px;
        }

        /* ================= MAIN ================= */

        .admin-main {
            margin-left: 250px;
            padding: 30px;
            min-height: calc(100vh - 72px);
        }

        /* ================= MOBILE NAV BUTTON ================= */

        .admin-mobile-toggle {
            display: none;
            width: 38px;
            height: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            color: #334155;
            font-size: 18px;
            cursor: pointer;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .admin-sidebar {
                width: 220px;
                transform: translateX(-100%);
                transition: transform .25s ease;
            }

            .admin-sidebar.show {
                transform: translateX(0);
            }

            .admin-topbar,
            .admin-main {
                margin-left: 0;
            }

            .admin-topbar {
                padding: 0 18px;
            }

            .admin-main {
                padding: 20px 15px;
            }

            .admin-mobile-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .admin-page-title {
                font-size: 15px;
            }

            .admin-user-info {
                display: none;
            }
        }

        @media (max-width: 480px) {

            .admin-topbar {
                height: 64px;
            }

            .admin-main {
                padding: 15px 10px;
            }

            .admin-user-avatar {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="admin-sidebar" id="adminSidebar">

    <div class="admin-brand">

        <div class="admin-logo">
            C
        </div>

        <div class="admin-brand-text">
            <strong>CAStudy</strong>
            <span>ADMINISTRATION</span>
        </div>

    </div>


    <nav class="admin-nav">

        <div class="admin-section">
            Tổng quan
        </div>

        <a th:href="@{/admin}"
           class="admin-nav-link"
           th:classappend="${currentUri != null && currentUri == '/admin'} ? 'active'">

            <span class="admin-nav-icon">📊</span>
            <span>Dashboard</span>

        </a>


        <div class="admin-section">
            Nội dung
        </div>

        <a th:href="@{/admin/rubrics}"
           class="admin-nav-link"
           th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/admin/rubrics')} ? 'active'">

            <span class="admin-nav-icon">📋</span>
            <span>Rubric</span>

        </a>


        <div class="admin-section">
            Quản lý
        </div>

        <a th:href="@{/admin/users}"
           class="admin-nav-link"
           th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/admin/users')} ? 'active'">

            <span class="admin-nav-icon">👥</span>
            <span>Users</span>

        </a>

    </nav>


    <div class="admin-sidebar-footer">

        <form th:action="@{/logout}" method="post">

            <button type="submit" class="admin-logout">
                🚪 &nbsp; Đăng xuất
            </button>

        </form>

    </div>

</aside>


<!-- ================= TOPBAR ================= -->

<header class="admin-topbar">

    <div class="d-flex align-items-center gap-3">

        <button
                type="button"
                class="admin-mobile-toggle"
                onclick="toggleAdminSidebar()">
            ☰
        </button>

        <div class="admin-page-title"
             th:replace="${title}">
            Admin
        </div>

    </div>


    <div class="admin-user">

        <div class="admin-user-avatar">
            A
        </div>

        <div class="admin-user-info">

            <small>Xin chào</small>

            <strong sec:authentication="name">
                Admin
            </strong>

        </div>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="admin-main">

    <th:block th:replace="${content}"/>

</main>


<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<script>
    function toggleAdminSidebar() {
        const sidebar = document.getElementById("adminSidebar");
        sidebar.classList.toggle("show");
    }
</script>

</body>
</html>
