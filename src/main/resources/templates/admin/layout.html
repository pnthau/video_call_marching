<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar {
            min-height: 100vh;
            background: #1e293b;
            color: #cbd5e1;
            width: 240px;
            position: fixed;
            top: 0; left: 0;
        }
        .sidebar .brand {
            padding: 1.5rem 1.25rem 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            padding: .55rem 1.25rem;
            border-radius: 0;
            font-size: .9rem;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: #334155;
            color: #f8fafc;
        }
        .sidebar .nav-section {
            font-size: .7rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #475569;
            padding: 1rem 1.25rem .25rem;
        }
        .main-content {
            margin-left: 240px;
            padding: 2rem;
        }
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: .75rem 2rem;
            margin-left: 240px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
    </style>
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────────── -->
<div class="sidebar d-flex flex-column">
    <div class="brand">🎌 Admin Panel</div>
    <nav class="flex-grow-1 pt-2">
        <div class="nav-section">Tổng quan</div>
        <a th:href="@{/admin}" class="nav-link"
           th:classappend="${currentUri != null && currentUri == '/admin'} ? 'active'">
            📊 Dashboard
        </a>

        <div class="nav-section">Nội dung</div>
        <a th:href="@{/admin/rubrics}" class="nav-link"
           th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/admin/rubrics')} ? 'active'">
            📋 Rubric
        </a>

        <div class="nav-section">Quản lý (Team)</div>
        <a th:href="@{/admin/users}" class="nav-link"
           th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/users')} ? 'active'">
            👥 Users
        </a>
    </nav>
    <div class="p-3" style="border-top: 1px solid #334155;">
        <a th:href="@{/logout}" class="nav-link text-danger">🚪 Đăng xuất</a>
    </div>
</div>

<!-- ── TOPBAR ────────────────────────────────────────────────── -->
<div class="topbar d-flex justify-content-between align-items-center">
    <span class="fw-semibold text-secondary" th:replace="${title}">Admin</span>
    <span class="text-muted small">
        Xin chào,
        <strong sec:authentication="name">Admin</strong>
    </span>
</div>

<!-- ── MAIN ──────────────────────────────────────────────────── -->
<div class="main-content">
    <th:block th:replace="${content}"/>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
