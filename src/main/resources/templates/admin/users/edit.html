<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>Sửa người dùng</title></head><body><section>
    <h1 class="h3">Sửa người dùng</h1>
    <form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}" class="card card-body">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" class="form-control" th:field="*{username}" maxlength="50"><div class="text-danger" th:errors="*{username}"></div></div>
        <div class="mb-3"><label class="form-label">Email</label><div class="form-control-plaintext" th:text="${user.email}">email@example.com</div><div class="form-text">Email is managed by the linked OAuth identity and cannot be changed here.</div></div>
        <div class="mb-3"><label class="form-label" for="currentLevel">Trình độ</label><select id="currentLevel" class="form-select" th:field="*{currentLevel}"><option th:each="level : ${levels}" th:value="${level}" th:text="${level}"></option></select><div class="text-danger" th:errors="*{currentLevel}"></div></div>
        <div><button class="btn btn-primary" type="submit">Lưu</button> <a class="btn btn-secondary" th:href="@{/admin/users/{id}(id=${user.id})}">Hủy</a></div>
    </form>
</section></body></html>
