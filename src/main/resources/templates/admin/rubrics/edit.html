<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::section})}">
<head><title>Sửa Rubric</title></head>
<body><section>
    <h1 class="h3">Sửa Rubric</h1>
    <p>Criteria: <code th:text="${rubric.criteria}">ACCURACY</code> (không thể thay đổi)</p>
    <form method="post" th:action="@{/admin/rubrics/edit/{id}(id=${rubric.id})}" th:object="${form}" class="card card-body">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3"><label class="form-label" for="displayName">Tên hiển thị</label><input id="displayName" class="form-control" th:field="*{displayName}" maxlength="100"><div class="text-danger" th:errors="*{displayName}"></div></div>
        <div class="mb-3"><label class="form-label" for="description">Mô tả</label><textarea id="description" class="form-control" th:field="*{description}" maxlength="1000" rows="5"></textarea><div class="text-danger" th:errors="*{description}"></div></div>
        <div><button class="btn btn-primary" type="submit">Lưu</button> <a class="btn btn-secondary" th:href="@{/admin/rubrics}">Hủy</a></div>
    </form>
</section></body></html>
