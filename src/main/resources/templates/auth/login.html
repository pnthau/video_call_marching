<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Videocall Marching Language</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative background blobs */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(236, 72, 153, 0) 70%);
            bottom: -150px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.25);
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: inline-block;
        }

        .google-btn {
            background-color: #ffffff;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            padding: 12px 24px;
            border-radius: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .google-btn:hover {
            background-color: #f8fafc;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .google-btn:active {
            transform: translateY(1px);
        }

        .alert-custom {
            border-radius: 12px;
            font-size: 0.9rem;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }

        .alert-custom-info {
            border-left: 4px solid #60a5fa;
        }

        .alert-custom-danger {
            border-left: 4px solid #f87171;
        }
    </style>
</head>
<body>
<main class="login-container">
    <div class="glass-card">
        <div class="card-body p-4 p-md-5 text-center">
            <div class="mb-4">
                <div class="brand-logo mb-2">Marching Language</div>
                <h1 class="h4 font-weight-bold text-white mb-1">Chào mừng bạn quay lại</h1>
                <p style="color: #94a3b8; font-size: 0.95rem;">Luyện nói tiếng Nhật phản xạ 1-1</p>
            </div>

            <!-- Notifications -->
            <div th:if="${param.logout}" class="alert alert-custom alert-custom-info text-start mb-4" role="alert">
                <div class="d-flex align-items-center">
                    <svg class="me-2 text-primary" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Bạn đã đăng xuất thành công.</span>
                </div>
            </div>

            <div th:if="${param.error}" class="alert alert-custom alert-custom-danger text-start mb-4" role="alert">
                <div class="d-flex align-items-center">
                    <svg class="me-2 text-danger" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Đăng nhập thất bại hoặc tài khoản đã bị vô hiệu hóa.</span>
                </div>
            </div>

            <div class="my-4 py-2">
                <a th:href="@{/oauth2/authorization/google}" class="google-btn text-decoration-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" class="me-2">
                        <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.58 14.99 1 12 1 7.35 1 3.37 3.67 1.39 7.56l3.89 3.02C6.21 7.58 8.87 5.04 12 5.04z"/>
                        <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.29 1.48-1.14 2.73-2.4 3.58l3.73 2.89c2.18-2.01 3.7-4.99 3.7-8.62z"/>
                        <path fill="#FBBC05" d="M5.28 14.78c-.23-.69-.36-1.42-.36-2.18s.13-1.49.36-2.18L1.39 7.4C.5 9.18 0 11.18 0 13.29s.5 4.11 1.39 5.89l3.89-3.4z"/>
                        <path fill="#34A853" d="M12 23c3.24 0 5.97-1.08 7.96-2.92l-3.73-2.89c-1.04.7-2.38 1.11-4.23 1.11-3.13 0-5.79-2.54-6.72-5.54l-3.89 3.02C3.37 20.33 7.35 23 12 23z"/>
                    </svg>
                    Tiếp tục với Google
                </a>
            </div>

            <div style="color: #64748b; font-size: 0.8rem; margin-top: 2rem;">
                Bằng cách tiếp tục, bạn đồng ý với Điều khoản Dịch vụ và Chính sách Bảo mật của chúng tôi.
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
