<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Universal Glassmorphism Top Navigation Bar -->
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg sticky-top glass-nav py-2" style="z-index: 1020;">
    <div class="container">
        <!-- Logo Marching Language -->
        <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none me-3" th:href="@{/}">
            <div class="brand-logo-badge">🗣️</div>
            <span class="brand-gradient fs-4">Marching Language</span>
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler border-0 shadow-none p-2" type="button" data-bs-toggle="collapse" data-bs-target="#universalNavbarContent" aria-controls="universalNavbarContent" aria-expanded="false" aria-label="Bật/tắt thanh điều hướng">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links & User Actions -->
        <div class="collapse navbar-collapse" id="universalNavbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom text-lg-nowrap" th:classappend="${activePage == 'home'} ? 'active' : ''" th:href="@{/}">
                        <span>🏠</span>
                        <span>Trang chủ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom text-lg-nowrap" th:classappend="${activePage == 'scripts'} ? 'active' : ''" th:href="@{/practice/scripts}">
                        <span>🗣️</span>
                        <span>Luyện Scripts</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom text-lg-nowrap" th:classappend="${activePage == 'audio'} ? 'active' : ''" th:href="@{/practice/audio-lessons}">
                        <span>🎧</span>
                        <span>Luyện Audio</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom text-lg-nowrap" th:classappend="${activePage == 'p2p'} ? 'active' : ''" th:href="@{/video-call}">
                        <span>👥</span>
                        <span>Ghép đôi P2P</span>
                    </a>
                </li>
            </ul>
            <!-- Auth Controls -->
            <div class="navbar-auth-controls d-flex align-items-center pt-3 pt-lg-0 mt-3 mt-lg-0">
                <!-- If Authenticated: Only avatar shown; click opens dropdown menu -->
                <div th:if="${isAuthenticated == true}" class="dropdown">
                    <button class="nav-avatar-btn dropdown-toggle" type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false" th:attr="aria-label=${currentUsername != null ? currentUsername : 'Tài khoản'}" th:title="${currentUsername != null ? currentUsername : 'Tài khoản'}">
                        <img th:if="${currentUserAvatar != null and !currentUserAvatar.isEmpty()}" th:src="${currentUserAvatar}" class="nav-avatar-img" alt="Avatar">
                        <span th:unless="${currentUserAvatar != null and !currentUserAvatar.isEmpty()}" class="nav-avatar-placeholder"
                              th:text="${currentUsername != null and !currentUsername.isEmpty() ? #strings.substring(currentUsername, 0, 1).toUpperCase() : 'U'}">U</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-lg-end nav-user-menu shadow-lg border-0" aria-labelledby="userMenuDropdown">
                        <!-- User Info Header -->
                        <li class="dropdown-header-user">
                            <div class="d-flex align-items-center gap-2">
                                <div class="flex-shrink-0" style="width: 38px; height: 38px;">
                                    <img th:if="${currentUserAvatar != null and !currentUserAvatar.isEmpty()}" th:src="${currentUserAvatar}" class="rounded-circle object-fit-cover w-100 h-100" alt="Avatar">
                                    <span th:unless="${currentUserAvatar != null and !currentUserAvatar.isEmpty()}" class="nav-avatar-placeholder fs-6"
                                          th:text="${currentUsername != null and !currentUsername.isEmpty() ? #strings.substring(currentUsername, 0, 1).toUpperCase() : 'U'}">U</span>
                                </div>
                                <div class="overflow-hidden" style="max-width: 175px;">
                                    <div class="fw-bold text-slate-900 text-truncate" th:text="${currentUsername != null ? currentUsername : 'Tài khoản'}">Tài khoản</div>
                                    <div class="text-muted small text-truncate" th:text="${currentUserEmail != null ? currentUserEmail : ''}">user@example.com</div>
                                </div>
                            </div>
                        </li>
                        <!-- Navigation Items -->
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}">
                                <span>👤</span>
                                <span>Hồ sơ cá nhân</span>
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/profile/edit}">
                                <span>✏️</span>
                                <span>Chỉnh sửa thông tin</span>
                            </a>
                        </li>
                        <li th:if="${currentUserRole == 'ADMIN'}">
                            <a class="dropdown-item text-primary" th:href="@{/admin}">
                                <span>🛡️</span>
                                <span>Trang quản trị</span>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start">
                                    <span>🚪</span>
                                    <span>Đăng xuất</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- If Not Authenticated -->
                <div th:unless="${isAuthenticated == true}" class="d-flex align-items-center gap-2 flex-wrap flex-lg-nowrap">
                    <a th:href="@{/login}" class="btn btn-primary btn-sm rounded-pill px-4 py-2 fw-semibold shadow-sm text-nowrap">
                        🚀 Bắt đầu miễn phí
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
