<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý User</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">
    <!-- ================= TIÊU ĐỀ ================= -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quản lý tài khoản User</h2>
        <a th:href="@{/users/add}"
           class="btn btn-success">
            + Thêm User
        </a>
    </div>
    <!-- ================= THÔNG BÁO ================= -->
    <div th:if="${param.success != null}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:if="${param.success[0] == 'add'}">
            Thêm User thành công!
        </span>
        <span th:if="${param.success[0] == 'edit'}">
            Cập nhật User thành công!
        </span>
        <span th:if="${param.success[0] == 'delete'}">
            Xóa User thành công!
        </span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>
    <!-- ================= TÌM KIẾM ================= -->
    <form th:action="@{/users}"
          method="get"
          class="row g-2 mb-4">
        <!-- Username -->
        <div class="col-md-4">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Tìm theo username"
                   th:value="${username}">
        </div>

        <!-- Email -->
        <div class="col-md-4">
            <input type="text"
                   name="email"
                   class="form-control"
                   placeholder="Tìm theo email"
                   th:value="${email}">
        </div>
        <!-- Nút -->
        <div class="col-md-4">
            <button type="submit"
                    class="btn btn-primary">
                Tìm kiếm
            </button>
            <a th:href="@{/users}"
               class="btn btn-secondary">
                Xóa tìm kiếm
            </a>
        </div>
    </form>
    <!-- ================= DANH SÁCH USER ================= -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Level</th>
            <th>Trust Score</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <!-- User -->
        <tr th:each="user : ${users.content}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.currentLevel}"></td>
            <td th:text="${user.trustScore}"></td>
            <td>
                <!-- Detail -->
                <a th:href="@{/users/{id}(id=${user.id})}"
                   class="btn btn-info btn-sm">
                    detail
                </a>
                <!-- Sửa -->
                <a th:href="@{/users/edit/{id}(id=${user.id})}"
                   class="btn btn-warning btn-sm">
                    Sửa
                </a>
                <!-- Xóa -->
                <form th:action="@{/users/delete/{id}(id=${user.id})}"
                      method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Bạn có chắc muốn xóa User này không?');">
                        Xóa
                    </button>
                </form>
            </td>
        </tr>
        <!-- Không có User -->
        <tr th:if="${users.content.isEmpty()}">

            <td colspan="6"
                class="text-center">
                Không có User nào
            </td>
        </tr>
        </tbody>
    </table>
    <!-- ================= PHÂN TRANG ================= -->
    <div class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <!-- Nút trang trước -->
            <li class="page-item"
                th:classappend="${users.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/users(
    page=${users.number - 1},
    username=${username},
    email=${email}
)}">
                    &laquo;
                </a>
            </li>
            <!-- SỐ TRANG -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                th:classappend="${i == users.number} ? 'active'">

                <a class="page-link"
                   th:href="@{/users(
    page=${i},
    username=${username},
    email=${email}
)}"
                   th:text="${i + 1}">
                </a>
            </li>
            <!-- Nút trang sau -->
            <li class="page-item"
                th:classappend="${users.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/users(
    page=${users.number + 1},
    username=${username},
    email=${email}
)}">
                    &raquo;
                </a>
            </li>
        </ul>
    </div>
    </div>
</body>
</html>
