<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phòng luyện nói (Video Call)</title>
    <!-- Bootstrap CSS local -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Agora SDK -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4 text-primary fw-bold">Phòng Luyện Nói 1-1</h2>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex flex-wrap gap-2 justify-content-center align-items-center">
                <input type="text" id="channel" class="form-control w-auto" placeholder="Tên phòng (vd: room1)" />
                <input type="number" id="uid" class="form-control w-auto" placeholder="ID của bạn (vd: 1)" />
                <button id="join-btn" class="btn btn-primary">Tham gia</button>
                <button id="leave-btn" class="btn btn-danger" disabled>Rời phòng</button>
                <button id="mic-btn" class="btn btn-outline-secondary" disabled>Tắt Mic</button>
                <button id="cam-btn" class="btn btn-outline-secondary" disabled>Tắt Camera</button>
            </div>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-md-6">
                <div class="video-box rounded shadow-sm bg-dark position-relative" style="height: 400px; overflow: hidden;">
                    <span class="badge bg-secondary position-absolute top-0 start-0 m-2" style="z-index: 10;">Bạn (Local)</span>
                    <div id="local-player" class="w-100 h-100"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="video-box rounded shadow-sm bg-dark position-relative" style="height: 400px; overflow: hidden;">
                    <span class="badge bg-secondary position-absolute top-0 start-0 m-2" style="z-index: 10;">Đối tác (Remote)</span>
                    <div id="remote-player" class="w-100 h-100"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Truyền AppID từ Backend xuống JS -->
    <script th:inline="javascript">
        const AGORA_APP_ID = /*[[${agoraAppId}]]*/ 'defaultAppId';
    </script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/video_call.js}"></script>
</body>
</html>
