<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chỉnh sửa hồ sơ - Videocall Marching Language</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-4">Chỉnh sửa hồ sơ</h1>

                    <form th:action="@{/profile/edit}" th:object="${updateProfileRequest}"
                          method="post" enctype="multipart/form-data" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên hiển thị</label>
                            <input id="username" type="text" th:field="*{username}"
                                   class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="avatar" class="form-label">Avatar</label>
                            <img th:if="${profile.avatarUrl() != null}" th:src="${profile.avatarUrl()}"
                                 class="rounded-circle object-fit-cover border d-block mb-2" width="96" height="96"
                                 alt="Avatar hiện tại">
                            <input id="avatar" type="file" th:field="*{avatar}" accept="image/jpeg,image/png,image/webp"
                                   class="form-control" th:classappend="${#fields.hasErrors('avatar')} ? 'is-invalid'">
                            <div class="form-text">JPEG, PNG hoặc WebP; tối đa 5 MB. Bỏ trống để giữ ảnh hiện tại.</div>
                            <div class="invalid-feedback" th:errors="*{avatar}"></div>
                        </div>

                        <hr class="my-4">
                        <h5 class="mb-3">Cấu hình AI</h5>

                        <div class="mb-3">
                            <label for="provider" class="form-label">AI Provider</label>
                            <select id="provider" th:field="*{provider}" class="form-select" th:classappend="${#fields.hasErrors('provider')} ? 'is-invalid'">
                                <option value="">-- Chọn mô hình AI --</option>
                                <option value="GROQ">⚡ Groq AI</option>
                                <option value="GEMINI">🤖 Google Gemini</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{provider}"></div>
                            <div class="form-text">Chọn mô hình AI mà bạn muốn kích hoạt cho các tính năng luyện tập nói.</div>
                        </div>

                        <div class="mb-4">
                            <label for="apiKey" class="form-label">API Key cho mô hình đã chọn</label>
                            <input id="apiKey" type="password" th:field="*{apiKey}" class="form-control" 
                                   th:classappend="${#fields.hasErrors('apiKey')} ? 'is-invalid'"
                                   placeholder="Nhập API key mới (để trống nếu muốn giữ nguyên key hiện tại)...">
                            <div class="invalid-feedback" th:errors="*{apiKey}"></div>
                            <div class="form-text mt-1">
                                <span th:if="${profile.apiKey() != null and !profile.apiKey().isBlank()}" class="text-success fw-medium d-block mb-1">
                                    ✅ Mô hình hiện tại đã có API Key (để trống nếu không muốn đổi key).
                                </span>
                                <span>Key của bạn sẽ được <strong>mã hoá an toàn (AES)</strong> trước khi lưu</span>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
                            <a class="btn btn-outline-secondary" th:href="@{/profile}">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
